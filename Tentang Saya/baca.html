<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membaca Fase 1 - Subchan Adi Maskuri</title>
  
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .reader-container {
      max-width: 750px;
      margin: 30px auto;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    
    .top-nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .nav-link {
      color: #666;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .nav-link:hover { color: #ff5000; }

    /* HEADER BANNER FASE */
    .phase-banner {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .phase-title {
      font-size: 2rem;
      color: #111;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    /* AUDIO PLAYER PODCAST */
    .audio-box {
      background: #f1f3f5;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 35px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-left: 4px solid #ff5000;
    }
    .audio-box span {
      font-size: 0.9rem;
      font-weight: bold;
      color: #444;
    }
    .audio-box audio {
      width: 100%;
    }

    /* TEKS PARAGRAF OTOMATIS */
    .story-content p {
      font-size: 1.1rem;
      line-height: 1.9;
      color: #333;
      text-align: justify;
      margin-bottom: 20px;
    }

    /* Drop-cap untuk paragraf pertama */
    .story-content p:first-child::first-letter {
      font-size: 3.2rem;
      font-weight: bold;
      color: #ff5000;
      float: left;
      margin-right: 10px;
      line-height: 1;
      padding-top: 4px;
    }
  </style>
</head>
<body>

  <div class="reader-container">
    <!-- NAVIGASI ATAS -->
    <div class="top-nav">
      <a href="cerita.html" class="nav-link"><i class="fa-solid fa-list"></i> Daftar Cerita</a>
      <a href="../../index.html" class="nav-link"><i class="fa-solid fa-house"></i> Beranda</a>
    </div>

    <!-- BANNER GAMBAR (fase1.png) -->
    <img src="fase1.png" alt="Cover Fase 1" class="phase-banner" onerror="this.style.display='none'">

    <h1 class="phase-title">Fase 001: Langkah Awal yang Tidak Linier</h1>

    <!-- AUDIO PODCAST (fase1.mp3) -->
    <div class="audio-box">
      <span><i class="fa-solid fa-podcast"></i> Podcast Narasi:</span>
      <audio controls>
        <source src="fase1.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung pemutar audio.
      </audio>
    </div>

    <!-- AREA ISI TEKS DARI fase1.txt -->
    <div class="story-content" id="storyContent">
      <p style="color: #999; font-style: italic;">Memuat cerita...</p>
    </div>
  </div>

  <!-- JAVASCRIPT OTOMATIS MEMBACA fase1.txt -->
  <script>
    fetch('fase1.txt')
      .then(response => {
        if (!response.ok) throw new Error("Gagal mengambil file teks");
        return response.text();
      })
      .then(text => {
        const container = document.getElementById('storyContent');
        container.innerHTML = ''; 
        
        // Memecah teks berdasarkan baris kosong (Enter 2x)
        const paragraphs = text.split(/\n\s*\n/);
        
        paragraphs.forEach(p => {
          if (p.trim() !== '') {
            const pTag = document.createElement('p');
            pTag.textContent = p.trim();
            container.appendChild(pTag);
          }
        });
      })
      .catch(err => {
        document.getElementById('storyContent').innerHTML = '<p style="color:red;">Gagal memuat teks cerita. Pastikan file fase1.txt sudah di-commit.</p>';
      });
  </script>

</body>
</html>
