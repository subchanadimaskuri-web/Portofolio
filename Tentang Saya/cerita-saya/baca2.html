<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membaca Fase 2 - Subchan Adi Maskuri</title>
  
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; margin: 0; padding: 0; }
    .reader-container { max-width: 750px; margin: 30px auto; padding: 40px 30px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .top-nav { display: flex; justify-content: space-between; margin-bottom: 30px; }
    .nav-link { color: #666; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .nav-link:hover { color: #ff5000; }
    .phase-banner { width: 100%; max-height: 350px; object-fit: cover; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .phase-title { font-size: 2rem; color: #111; margin-bottom: 20px; line-height: 1.3; }
    .audio-box { background: #f1f3f5; padding: 15px 20px; border-radius: 10px; margin-bottom: 35px; display: flex; align-items: center; gap: 15px; border-left: 4px solid #ff5000; }
    .audio-box span { font-size: 0.9rem; font-weight: bold; color: #444; }
    .audio-box audio { width: 100%; }
    
    /* DESAIN TEKS OTOMATIS */
    .story-content p { font-size: 1.1rem; line-height: 1.9; color: #333; text-align: justify; margin-bottom: 20px; }
    .story-content p:first-child::first-letter { font-size: 3.2rem; font-weight: bold; color: #ff5000; float: left; margin-right: 10px; line-height: 1; padding-top: 4px; }
    
    /* DESAIN KHUSUS SUBJUDUL FASE 2 */
.story-content h2 { 
  font-size: 1.5rem; 
  font-weight: 800; /* <--- INI KUNCI AGAR JUDUL SANGAT TEBAL */
  color: #2980b9; 
  margin-top: 45px; 
  margin-bottom: 15px; 
  border-bottom: 2px dashed #eee; 
  padding-bottom: 10px; 
  line-height: 1.4; 
}
  </style>
</head>
<body>

  <div class="reader-container">
    <div class="top-nav">
      <a href="cerita.html" class="nav-link"><i class="fa-solid fa-list"></i> Daftar Cerita</a>
      <a href="../../index.html" class="nav-link"><i class="fa-solid fa-house"></i> Beranda</a>
    </div>

    <!-- Panggil gambar fase2.jpg -->
    <img src="fase2.jpg" alt="Cover Fase 2" class="phase-banner" onerror="this.style.display='none'">

    <h1 class="phase-title">Fase 002: Belajar Spartan dan Rekayasa Sistem di Belakang Layar</h1>

    <div class="audio-box">
      <span><i class="fa-solid fa-podcast"></i> Podcast Narasi:</span>
      <audio controls>
        <source src="fase2.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung pemutar audio.
      </audio>
    </div>

    <!-- Area Teks Fase 2 -->
    <div class="story-content" id="storyContent">
      <p style="color: #999; font-style: italic;">Memuat cerita Fase 2...</p>
    </div>
  </div>

  <!-- SCRIPT CERDAS PENDETEKSI SUBJUDUL -->
  <script>
    fetch('fase2.txt')
      .then(response => response.text())
      .then(text => {
        const container = document.getElementById('storyContent');
        container.innerHTML = ''; 
        
        const paragraphs = text.split(/\n\s*\n/);
        
        paragraphs.forEach(p => {
          const cleanText = p.trim();
          if (cleanText !== '') {
            // Logika Deteksi: Jika teks pendek (kurang dari 120 huruf) dan tidak diakhiri titik/tanya, jadikan Subjudul (H2)
            if (cleanText.length < 120 && !cleanText.endsWith('.') && !cleanText.endsWith('?')) {
              const h2 = document.createElement('h2');
              h2.textContent = cleanText;
              container.appendChild(h2);
            } else {
              const pTag = document.createElement('p');
              pTag.textContent = cleanText;
              container.appendChild(pTag);
            }
          }
        });
      })
      .catch(err => {
        document.getElementById('storyContent').innerHTML = '<p style="color:red;">Gagal memuat teks cerita.</p>';
      });
  </script>

</body>
</html>
